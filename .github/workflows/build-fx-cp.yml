name: Build (fx-cp)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/therainbowphoenix/gint-docker:main

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build (fxsdk build-cp)
        run: |
          fxsdk build-cp
          test -s gintctl.hh3

      - name: Upload gintctl.hh3
        uses: actions/upload-artifact@v4
        with:
          name: gintctl.hh3
          path: gintctl.hh3
          if-no-files-found: error
          retention-days: 14
